# EURAnovaMultiAcqf 单一权威配置说明
#
# 这一个文件现在同时承担三件事：
# 1. 快速开始模板
# 2. 完整参数参考
# 3. 常见场景配方
#
# 其他配置文件只保留轻量入口，不再各自维护完整说明。
#
# 关键规则：
# 1. 运行时所有参数都放在 [EURAnovaMultiAcqf] 这一节。
# 2. 想使用默认值或自动行为时，不要写 None，直接删掉或注释掉该行。
# 3. interaction_pairs 省略时会自动生成全部二阶交互。
# 4. interaction_triplets 省略时不会生成三阶交互。
# 5. total_budget 只有在 gamma_min 和 tau_n_max 也被省略时，才会自动推导它们。

[EURAnovaMultiAcqf]

# ============================================================
# A. 快速开始模板
# ============================================================
# 如果你只想先跑通，先保留下面这组值，再按需要逐项细调。

enable_main = true
enable_pairwise = true
enable_threeway = false

main_weight = 1.0
use_dynamic_lambda = true
tau1 = 0.7
tau2 = 0.3
lambda_min = 0.1
lambda_max = 1.0
lambda_2_init = 0.1

gamma = 0.3
use_dynamic_gamma = true
gamma_max = 0.5
gamma_min = 0.05
tau_n_min = 3
tau_n_max = 25

use_sps = true
sps_sensitivity = 8.0
sps_ema_alpha = 0.7
tau_safe = 0.5
gamma_penalty_beta = 0.3

coverage_method = min_distance
fusion_method = additive

variable_types_list = continuous, continuous, continuous, continuous

local_jitter_frac = 0.1
local_num = 4
random_seed = 42

use_hybrid_perturbation = false
exhaustive_level_threshold = 3
exhaustive_use_cyclic_fill = true
auto_compute_local_num = false
auto_local_num_max = 12

debug_components = false
diagnostics_enabled = false
diagnostics_verbose = false
log_level = WARNING

# diagnostics_output_file = logs/eur_diagnostics.jsonl
# interaction_pairs = 0,1; 1,2
# interaction_triplets = 0,1,2
# lambda_3 = 0.5
# ard_weights = 0.4, 0.2, 0.2, 0.2
# total_budget = 40

# ============================================================
# B. 先看结论
# ============================================================
# 1. 最常改的只有四组：
#    - 结构: enable_pairwise / enable_threeway / interaction_pairs
#    - 动态权重: lambda_2_init / lambda_min / lambda_max
#    - 覆盖探索: gamma / gamma_max / local_jitter_frac
#    - 局部采样: local_num / use_hybrid_perturbation
# 2. 有离散变量时，优先先写对 variable_types_list。
# 3. 先跑通，再考虑三阶交互和 piecewise lambda。
# 4. 如果你只知道少数交互重要，显式写 interaction_pairs，计算会更稳也更快。

# ============================================================
# C. 完整参数参考
# ============================================================

# ----------------------------
# C1. 结构开关
# ----------------------------
# enable_main:
#   是否启用主效应。通常应保持 true。
#
# enable_pairwise:
#   是否启用二阶交互。
#   true 且 interaction_pairs 被省略 -> 自动生成全部二阶交互。
#
# enable_threeway:
#   是否允许三阶交互进入总信息项。
#   只有 interaction_triplets 被显式给出时才会实际参与。

# interaction_pairs:
#   格式: 0,1; 1,2; 2,3
#   用途: 只计算指定二阶交互。
#   省略: 自动生成全部 pairwise。
#
# interaction_triplets:
#   格式: 0,1,2; 1,2,3
#   用途: 指定三阶交互。
#   省略: 不计算三阶。

# ----------------------------
# C2. 信息项权重
# ----------------------------
# main_weight:
#   主效应总权重。默认 1.0。
#   偏离 1.0 会改变原设计公式，但代码允许。
#
# lambda_2:
#   如果显式给值，就使用固定二阶权重。
#   一旦显式给值，use_dynamic_lambda 和 lambda_2_init 都不再控制二阶权重。
#
# lambda_2_init:
#   动态二阶权重的首阶段初值。
#   仅在以下条件同时满足时生效：
#   - lambda_2 没有显式给值
#   - use_dynamic_lambda = true
#   - use_piecewise_lambda = false
#
# lambda_3:
#   三阶交互权重。
#   只有 enable_threeway = true 且给了 interaction_triplets 时有意义。

# ----------------------------
# C3. 动态 lambda
# ----------------------------
# use_dynamic_lambda:
#   true -> 用 r_t 控制二阶权重。
#   false -> 如果同时给了 lambda_2，就用固定权重。
#
# 当前实现的真实规则不是 sigmoid，也不是再做一次 lambda EMA。
# 实际上是：
#   r_t > tau1      -> lambda_2 = lambda_min
#   r_t < tau2      -> lambda_2 = lambda_max
#   其他区间         -> 在线性区间内插值
#
# tau1 / tau2:
#   tau1 必须大于 tau2。
#   tau1 越高，系统越不容易把模型判断为“已足够稳定”。
#   tau2 越低，系统越晚进入最大交互权重。
#
# lambda_min / lambda_max:
#   动态二阶权重的上下界。

# use_piecewise_lambda:
#   true 时会覆盖 r_t 规则，直接按样本数分阶段控制 lambda。
#
# piecewise_phase1_end / piecewise_phase2_end:
#   Phase 1: n < phase1_end       -> piecewise_lambda_low
#   Phase 2: 中间线性增长
#   Phase 3: n >= phase2_end      -> piecewise_lambda_high

# ----------------------------
# C4. 动态 gamma
# ----------------------------
# gamma:
#   覆盖项基础权重。
#
# use_dynamic_gamma:
#   true 时按样本数线性衰减，再叠加 safety brake。
#
# gamma_max / gamma_min:
#   gamma 的上下界。
#
# tau_n_min / tau_n_max:
#   n < tau_n_min     -> gamma = gamma_max
#   n >= tau_n_max    -> gamma = gamma_min
#   中间              -> 线性插值
#
# total_budget:
#   仅当 gamma_min 和 tau_n_max 都省略时，自动推导：
#   - tau_n_max = int(total_budget * 0.7)
#   - gamma_min = 0.05 if total_budget < 30 else 0.1

# ----------------------------
# C5. SPS 与 safety brake
# ----------------------------
# use_sps:
#   是否使用骨架点预测稳定性来计算 r_t。
#   有离散变量时通常建议 true。
#
# sps_sensitivity:
#   对预测变化的放大系数。高一些更敏感。
#
# sps_ema_alpha:
#   SPS 自己内部对 r_t 的平滑权重。
#
# tau_safe / gamma_penalty_beta:
#   当 r_t > tau_safe 时，gamma 会被额外抬高：
#   gamma_t = gamma_base + gamma_penalty_beta * (r_t - tau_safe)
#   然后再被夹到 [gamma_min, 1.0]。

# ----------------------------
# C6. 覆盖与融合
# ----------------------------
# coverage_method:
#   当前支持: min_distance, mean_distance
#
# fusion_method:
#   当前支持: additive, multiplicative
#   additive       -> info + gamma * coverage
#   multiplicative -> info * (1 + gamma * coverage)

# ----------------------------
# C7. 变量类型与距离权重
# ----------------------------
# variable_types_list:
#   当前支持：
#   categorical, continuous, integer, ordinal,
#   custom_ordinal, custom_ordinal_mono
#   以及 cat / cont / int / ord 前缀。
#
# 重要限制：
#   - 不支持旧文档里的单字母缩写。
#   - coverage 当前只把 categorical 明确当成离散；其他类型按数值处理。
#
# ard_weights:
#   只支持数值列表，不支持 auto。
#   解析后会自动归一化到和为 1。

# ----------------------------
# C8. 局部扰动
# ----------------------------
# local_jitter_frac:
#   局部高斯扰动幅度，约等于特征范围的这个比例。
#
# local_num:
#   每个候选点额外生成多少个局部变体。
#
# random_seed:
#   固定后可复现；在 subject context 存在时还会混入 subject_id。

# use_hybrid_perturbation:
#   对低水平离散变量用穷举，对其余维度仍做常规扰动。
#
# exhaustive_level_threshold:
#   水平数小于等于这个阈值时，离散变量走穷举。
#
# exhaustive_use_cyclic_fill:
#   穷举数量不足 local_num 时是否循环填充。
#
# auto_compute_local_num:
#   true 时会基于低水平离散变量的水平数求 LCM，再用 auto_local_num_max 截断。

# ----------------------------
# C9. 调试与日志
# ----------------------------
# debug_components:
#   是否输出组件级调试信息。
#
# diagnostics_enabled / diagnostics_verbose:
#   是否记录更完整的诊断内容。
#
# diagnostics_output_file:
#   诊断输出路径。为空时不输出文件。
#
# log_level:
#   传给 logging_setup 的日志级别。

# ============================================================
# D. 快速调参索引
# ============================================================
# 现象: 采样太保守，交互挖得不够
# 先改: lambda_2_init, lambda_max, enable_threeway
# 方向: 往上调
#
# 现象: 采样太分散，利用不足
# 先改: gamma, gamma_max, local_jitter_frac
# 方向: 往下调
#
# 现象: 离散组合覆盖不好
# 先改: variable_types_list, use_hybrid_perturbation, local_num
#
# 现象: 计算太慢
# 先改: interaction_pairs, local_num, enable_threeway
#
# 现象: 想把早中后期策略写死
# 先改: use_piecewise_lambda

# ============================================================
# E. 场景配方
# ============================================================

# E1. 纯连续问题，先跑通
# --------------------------------
# variable_types_list = continuous, continuous, continuous, continuous
# use_hybrid_perturbation = false
# enable_threeway = false

# E2. 混合变量问题
# --------------------------------
# variable_types_list = categorical, continuous, integer, ordinal
# use_hybrid_perturbation = true
# local_num = 6
# coverage_method = min_distance

# E3. 小预算问题
# --------------------------------
# gamma = 0.4
# gamma_max = 0.6
# local_num = 3
# enable_threeway = false

# E4. 明确只关心少数二阶交互
# --------------------------------
# interaction_pairs = 0,1; 2,3
# enable_threeway = false

# E5. 想按阶段推进交互探索
# --------------------------------
# use_piecewise_lambda = true
# piecewise_phase1_end = 20
# piecewise_phase2_end = 40
# piecewise_lambda_low = 0.2
# piecewise_lambda_high = 0.8

# ============================================================
# F. 使用建议
# ============================================================
# 1. 复制本文件，先只改 variable_types_list 和 interaction_pairs。
# 2. 如果你不知道该不该写 interaction_pairs，就先省略，让系统自动生成全部二阶交互。
# 3. 如果你打算用 total_budget 自动推导，请记得同时删掉 gamma_min 和 tau_n_max。
# 4. 如果要固定二阶权重，就直接显式写 lambda_2，并删掉 lambda_2_init 以免误导自己。
